<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement</title>
  <desc id="desc">The browser sends requests to the Express server, which mounts four API routers and serves printable invoices. The center lists all ten library modules and the JSON datastore. A numbered sequence traces checkout from the Place Order button through the HTTP 201 response. The invoice module is highlighted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#677e99"/>
    </marker>
    <marker id="invoice-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8z" fill="#7839a7"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, "Segoe UI", sans-serif; fill: #182b42; }
    .title { font-size: 34px; font-weight: 720; }
    .subtitle { font-size: 15px; fill: #486077; }
    .section { font-size: 14px; font-weight: 720; letter-spacing: 1px; fill: #375573; }
    .file { font-family: Consolas, "Courier New", monospace; font-size: 15px; font-weight: 700; }
    .detail { font-size: 13px; fill: #36516d; }
    .code { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #304c68; }
    .card { fill: #fff; stroke: #ced9e5; }
    .panel { fill: #eef3f8; stroke: #d9e3ee; }
    .checkout { fill: #e7f2fa; stroke: #89abc8; }
    .ticket { fill: #f2e7fa; stroke: #a46bc6; }
    .violet { fill: #65288b; }
    .arrow { fill: none; stroke: #677e99; stroke-width: 1.6; marker-end: url(#arrow); }
    .invoice-arrow { fill: none; stroke: #7839a7; stroke-width: 1.6; marker-end: url(#invoice-arrow); }
    .step-title { font-size: 15px; font-weight: 700; }
    .step-number { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; }
    .separator { stroke: #d9e3ee; }
  </style>

  <rect width="1200" height="800" fill="#f7f9fc"/>
  <path d="M32 100H1168" class="separator"/>
  <text x="32" y="52" class="title">ShopLedger architecture</text>
  <text x="34" y="78" class="subtitle">Point of sale, Khata credit and printable GST invoices</text>
  <rect x="830" y="39" width="15" height="15" rx="3" class="ticket"/>
  <text x="852" y="51" class="detail">Ticket module</text>
  <rect x="954" y="39" width="15" height="15" rx="3" class="checkout"/>
  <text x="976" y="51" class="detail">Order router</text>
  <path d="M1083 46h24" class="arrow"/>
  <text x="1114" y="51" class="detail">Call / I/O</text>

  <text x="32" y="126" class="section">BROWSER &amp; EXPRESS</text>
  <rect x="32" y="139" width="274" height="61" rx="9" class="card"/>
  <text x="46" y="162" class="file">public/</text>
  <text x="46" y="183" class="detail">POS, order register, Khata and audit UI</text>
  <path d="M169 200v15" class="arrow"/>
  <rect x="32" y="215" width="274" height="72" rx="9" class="card"/>
  <text x="46" y="238" class="file">server.js</text>
  <text x="46" y="257" class="detail">Serves public/ and mounts API routers</text>
  <text x="46" y="276" class="code violet">GET /orders/:id/invoice</text>
  <path d="M169 287v17" class="arrow"/>
  <path d="M306 271h24" class="invoice-arrow"/>

  <rect x="32" y="304" width="274" height="275" rx="10" class="panel"/>
  <text x="46" y="327" class="section">ROUTERS MOUNTED AT /api</text>
  <rect x="44" y="339" width="250" height="49" rx="7" class="checkout"/>
  <text x="55" y="359" class="file">routes/orders.js</text>
  <text x="55" y="377" class="detail">Place, list, look up and cancel orders</text>
  <rect x="44" y="397" width="250" height="49" rx="7" class="card"/>
  <text x="55" y="417" class="file">routes/products.js</text>
  <text x="55" y="435" class="detail">Product catalog and active coupons</text>
  <rect x="44" y="455" width="250" height="49" rx="7" class="card"/>
  <text x="55" y="475" class="file">routes/customers.js</text>
  <text x="55" y="493" class="detail">Khata accounts and settlements</text>
  <rect x="44" y="513" width="250" height="53" rx="7" class="card"/>
  <text x="55" y="533" class="file">routes/reports.js</text>
  <text x="55" y="552" class="detail">Dashboard, GST, cart preview, export</text>
  <path d="M306 363h24" class="arrow"/>

  <rect x="32" y="603" width="274" height="90" rx="9" class="card"/>
  <text x="46" y="627" class="file">config.js</text>
  <text x="46" y="648" class="detail">Port and shop details, HSN GST rates,</text>
  <text x="46" y="667" class="detail">coupon rules and inventory defaults</text>

  <text x="330" y="126" class="section">LIBRARY MODULES</text>
  <text x="330" y="155" class="detail">The invoice route reads the saved order, then calls render().</text>
  <text x="330" y="176" class="detail">Checkout builds its totals through pricing.js and tax.js.</text>
  <rect x="330" y="222" width="230" height="68" rx="9" class="ticket"/>
  <text x="344" y="244" class="file violet">lib/invoice.js</text>
  <text x="344" y="262" class="code violet">computeInvoiceFigures()</text>
  <text x="344" y="280" class="detail">Recalculates and renders invoices</text>
  <rect x="574" y="222" width="230" height="68" rx="9" class="card"/>
  <text x="588" y="244" class="file">lib/reports.js</text>
  <text x="588" y="262" class="code">getGstReconciliation()</text>
  <text x="588" y="280" class="detail">Compares invoice and saved totals</text>
  <path d="M574 255h-14" class="invoice-arrow"/>

  <rect x="330" y="307" width="230" height="68" rx="9" class="card"/>
  <text x="344" y="329" class="file">lib/pricing.js</text>
  <text x="344" y="347" class="code">subtotal(), computeTotals()</text>
  <text x="344" y="365" class="detail">Spreads discounts and totals cart</text>
  <rect x="574" y="307" width="230" height="68" rx="9" class="card"/>
  <text x="588" y="329" class="file">lib/tax.js</text>
  <text x="588" y="347" class="code">getRateForItem()</text>
  <text x="588" y="365" class="detail">Resolves rates and splits GST</text>
  <path d="M560 341h14" class="arrow"/>
  <path d="M445 375v17" class="arrow"/>

  <rect x="330" y="392" width="230" height="68" rx="9" class="card"/>
  <text x="344" y="414" class="file">lib/coupons.js</text>
  <text x="344" y="432" class="code">validate(), calculateDiscount()</text>
  <text x="344" y="450" class="detail">Checks codes and applies caps</text>
  <rect x="574" y="392" width="230" height="68" rx="9" class="card"/>
  <text x="588" y="414" class="file">lib/inventory.js</text>
  <text x="588" y="432" class="code">find(), check(), reserve()</text>
  <text x="588" y="450" class="detail">Checks and deducts stock</text>

  <rect x="330" y="477" width="230" height="68" rx="9" class="card"/>
  <text x="344" y="499" class="file">lib/orders.js</text>
  <text x="344" y="517" class="code">add(), get(), list(), cancel()</text>
  <text x="344" y="535" class="detail">Manages order records</text>
  <rect x="574" y="477" width="230" height="68" rx="9" class="card"/>
  <text x="588" y="499" class="file">lib/ledger.js</text>
  <text x="588" y="517" class="code">chargeOrderToKhata()</text>
  <text x="588" y="535" class="detail">Handles credit and repayments</text>
  <path d="M445 545v17" class="arrow"/>

  <rect x="330" y="562" width="230" height="68" rx="9" class="card"/>
  <text x="344" y="584" class="file">lib/dates.js</text>
  <text x="344" y="602" class="code">today(), normalizeDateKey()</text>
  <text x="344" y="620" class="detail">Date stamps and filter keys</text>
  <rect x="574" y="562" width="230" height="68" rx="9" class="card"/>
  <text x="588" y="584" class="file">lib/store.js</text>
  <text x="588" y="602" class="code">read(), write(), appendAudit()</text>
  <text x="588" y="620" class="detail">Synchronous JSON file I/O</text>
  <path d="M689 630v18" class="arrow"/>
  <rect x="574" y="648" width="230" height="77" rx="9" class="panel"/>
  <text x="588" y="672" class="file">data/db.json</text>
  <text x="588" y="692" class="detail">Products, customers, orders,</text>
  <text x="588" y="711" class="detail">settlements, audit log and IDs</text>

  <rect x="828" y="113" width="340" height="612" rx="12" class="panel"/>
  <text x="848" y="143" class="section">PLACING AN ORDER</text>
  <path d="M858 174v476" stroke="#afc2d5" stroke-width="2"/>

  <circle cx="858" cy="181" r="11" fill="#285777"/><text x="858" y="186" class="step-number">1</text>
  <text x="879" y="186" class="step-title">Submit cart</text>
  <text x="879" y="207" class="code">post('/api/orders', ...)</text>
  <text x="879" y="225" class="detail">The browser sends item IDs and quantities,</text>
  <text x="879" y="243" class="detail">customer details, payment, status and coupon.</text>

  <circle cx="858" cy="266" r="11" fill="#285777"/><text x="858" y="271" class="step-number">2</text>
  <text x="879" y="271" class="step-title">Load and check stock</text>
  <text x="879" y="292" class="code">store.read() → inventory.find(), check()</text>
  <text x="879" y="310" class="detail">The order router fetches catalog prices</text>
  <text x="879" y="328" class="detail">and checks sellable quantities.</text>

  <circle cx="858" cy="351" r="11" fill="#285777"/><text x="858" y="356" class="step-number">3</text>
  <text x="879" y="356" class="step-title">Validate coupon and price the order</text>
  <text x="879" y="377" class="code">validate() → pricing.computeTotals()</text>
  <text x="879" y="395" class="detail">Allocate the discount before applying</text>
  <text x="879" y="413" class="detail">the GST rate to each line.</text>

  <circle cx="858" cy="436" r="11" fill="#285777"/><text x="858" y="441" class="step-number">4</text>
  <text x="879" y="441" class="step-title">Charge Khata when selected</text>
  <text x="879" y="462" class="code">ledger.chargeOrderToKhata()</text>
  <text x="879" y="480" class="detail">Check the credit limit and update balance.</text>

  <circle cx="858" cy="506" r="11" fill="#285777"/><text x="858" y="511" class="step-number">5</text>
  <text x="879" y="511" class="step-title">Deduct stock and add the order</text>
  <text x="879" y="532" class="code">inventory.reserve() → orders.add()</text>
  <text x="879" y="550" class="detail">Assign an ID and save items and totals</text>
  <text x="879" y="568" class="detail">to the order record in memory.</text>

  <circle cx="858" cy="591" r="11" fill="#285777"/><text x="858" y="596" class="step-number">6</text>
  <text x="879" y="596" class="step-title">Write changes to disk</text>
  <text x="879" y="617" class="code">store.appendAudit() → store.write()</text>
  <text x="879" y="635" class="detail">Write the order, stock, audit and Khata changes.</text>

  <circle cx="858" cy="661" r="11" fill="#285777"/><text x="858" y="666" class="step-number">7</text>
  <text x="879" y="666" class="step-title">Return HTTP 201</text>
  <text x="879" y="687" class="detail">The browser shows the saved total and a link</text>
  <text x="879" y="705" class="detail">to the printable invoice.</text>

  <path d="M32 747H1168" class="separator"/>
  <text x="34" y="773" class="detail">Checkout uses HSN rates on discounted lines. The invoice recalculates GST on gross lines without the HSN lookup.</text>
</svg>
